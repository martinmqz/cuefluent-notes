name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-v2-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  guidance:
    # Guidance tooling is separate from artifact-producing jobs and omitted for
    # an explicitly selected release tag's already-reviewed source guidance.
    if: ${{ inputs.release_tag == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check:guidance

  test:
    name: Synthetic tests and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: ${{ inputs.release_tag && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Verify an explicitly selected release tag before running source tools
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          if (!/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$/.test(tag)) throw new Error('An exact version tag such as v0.16.0 is required.');
          const metadata = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (metadata.version !== tag.slice(1)) throw new Error('The tag and source package version differ.');
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (git(['rev-parse', 'HEAD']) !== git(['rev-parse', `refs/tags/${tag}^{commit}`])) throw new Error('Checkout is not the exact tag commit.');
          execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          NODE
      - name: Record native host and pinned runtime
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})"
      - name: Select fresh runner-local cache and output paths
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const cache = path.join(process.env.RUNNER_TEMP, 'cuefluent-v2-npm-cache');
          const build = path.join(process.env.RUNNER_TEMP, `cuefluent-v2-candidate-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `npm_config_cache=${cache}\nCUEFLUENT_TEST_NPM_CACHE=${cache}\nCUEFLUENT_BUILD_ROOT=${build}\n`);
          NODE
      - run: npm ci --ignore-scripts
      - name: Full synthetic source suite on this native operating system
        # Includes all queue, gate, worker and filesystem tests. Test-owned
        # explicit unsupported cases do not claim native client acceptance.
        # Each Windows test process owns native PowerShell helpers; overlapping
        # files can exhaust helper deadlines on the hosted runner. Serialize
        # files while retaining concurrency exercised inside the tests.
        run: ${{ runner.os == 'Windows' && 'node --test --test-concurrency=1 "test/**/*.test.mjs"' || 'npm test' }}
      - run: npm run check:examples
      - name: Build, verify, copy and exercise detached actual entry points
        run: node tools/ci.mjs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-candidate-${{ matrix.os }}
          path: |
            ${{ env.CUEFLUENT_BUILD_ROOT }}/*.zip
            ${{ env.CUEFLUENT_BUILD_ROOT }}/*.tar.gz
            ${{ env.CUEFLUENT_BUILD_ROOT }}/build.json
          if-no-files-found: error
          retention-days: 7

  reproducibility:
    name: Candidate reproducibility
    if: ${{ always() && !cancelled() }}
    needs: [guidance, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful source jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          GUIDANCE_RESULT: ${{ needs.guidance.result }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.TEST_RESULT !== 'success' ||
              (process.env.RELEASE_TAG ? process.env.GUIDANCE_RESULT !== 'skipped' : process.env.GUIDANCE_RESULT !== 'success')) {
            throw new Error('Required synthetic source checks did not pass.');
          }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: v2-candidate-*
          path: ${{ runner.temp }}/cuefluent-v2-artifacts
      - name: Verify every archive hash and compare all three build receipts
        env:
          CUEFLUENT_ARTIFACT_ROOT: ${{ runner.temp }}/cuefluent-v2-artifacts
        run: node tools/ci.mjs compare

name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing v2 tag on main history; must match package.json
        required: true
        type: string
      confirm:
        description: Authorize tests and candidate artifacts only; nothing is published
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prepare-v2-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.confirm && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ inputs.tag }}

name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing version tag on main history, for example v0.16.0; must match package.json
        required: true
        type: string
      checks_run_id:
        description: Successful Checks run with retained candidates for the exact tagged source
        required: true
        type: string
      confirm:
        description: Authorize verification and reuse of tested candidate artifacts only; nothing is published
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: prepare-v2-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.confirm && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CHECKS_RUN_ID: ${{ inputs.checks_run_id }}
      CUEFLUENT_RELEASE_NAME: cuefluent-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Verification code comes from the authorized main dispatch, never from a
      # downloaded candidate. Candidate archives remain data throughout this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Verify the tag and select artifacts from successful checks
        id: source
        run: node tools/release-candidate.mjs select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUEFLUENT_RELEASE_ROOT: ${{ runner.temp }}/${{ env.CUEFLUENT_RELEASE_NAME }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/${{ env.CUEFLUENT_RELEASE_NAME }}/artifacts
          digest-mismatch: error
      - name: Verify tested source, provenance and every retained archive
        run: node tools/release-candidate.mjs verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUEFLUENT_RELEASE_ROOT: ${{ runner.temp }}/${{ env.CUEFLUENT_RELEASE_NAME }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.tag }}
          path: ${{ runner.temp }}/${{ env.CUEFLUENT_RELEASE_NAME }}/candidate
          if-no-files-found: error
          retention-days: 30
